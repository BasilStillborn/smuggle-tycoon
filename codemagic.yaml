workflows:
  android-release:
    name: Android release AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
      android_signing:
        - uk_arrival_kit_keystore
      groups:
        - google_play_credentials
      vars:
        PACKAGE_NAME: app.ukarrivalkit.mobile
    scripts:
      - name: Install dependencies
        script: |
          cd first-week-britain
          npm ci
      - name: Build web app
        script: |
          cd first-week-britain
          npm run build
      - name: Generate and sync Android project
        script: |
          cd first-week-britain
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build Android App Bundle
        script: |
          cd first-week-britain/android
          ./gradlew bundleRelease
    artifacts:
      - first-week-britain/android/app/build/outputs/**/*.aab
      - first-week-britain/android/app/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        track: internal
        submit_as_draft: true

  ios-testflight:
    name: iOS TestFlight IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: UK Arrival Kit App Store Connect
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.ukarrivalkit.mobile
      vars:
        BUNDLE_ID: app.ukarrivalkit.mobile
        XCODE_WORKSPACE: first-week-britain/ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: |
          cd first-week-britain
          npm ci
      - name: Build web app
        script: |
          cd first-week-britain
          npm run build
      - name: Generate and sync iOS project
        script: |
          cd first-week-britain
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd first-week-britain/ios/App
          pod install
      - name: Configure code signing
        script: |
          xcode-project use-profiles --project first-week-britain/ios/App/App.xcodeproj
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
